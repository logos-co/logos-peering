name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # libpeering's suite runs in its checkPhase; the modules and the facade
      # host only have to build.
      - name: libpeering (tests)
        run: nix build .#libpeering --print-build-logs
      - name: peering_identity and peering_module
        run: nix build .#peering_identity .#peering_module --print-build-logs
      - name: logos_host_remote
        run: nix build .#logos_host_remote --print-build-logs
